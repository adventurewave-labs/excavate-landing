<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excavate has moved</title>
  <link rel="canonical" href="https://adventurewave-labs.github.io/excavate/">
  <script>
    const destination = new URL(document.querySelector('link[rel="canonical"]').href);
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://adventurewave-labs.github.io/excavate/">
  </noscript>
</head>
<body>
  <p>Excavate has moved. <a href="https://adventurewave-labs.github.io/excavate/">Continue to Excavate</a>.</p>
</body>
</html>
